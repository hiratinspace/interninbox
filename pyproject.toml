[project]
name = "interninbox"
version = "0.1.0"
description = "Zero-API-key internship finder: list your target companies, run one command, get matching internships in your terminal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Interninbox contributors" }]
keywords = ["internships", "jobs", "cli", "greenhouse", "lever", "ashby", "usajobs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/hiratinspace/interninbox"

[project.scripts]
interninbox = "interninbox.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interninbox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
