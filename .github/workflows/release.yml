# Publishes to PyPI via Trusted Publishing (OIDC) — no tokens stored anywhere.
# Trigger: publishing a GitHub Release (tag vX.Y.Z).
# PyPI side: the project must list this repo + workflow as a trusted publisher for the `interninbox` project
# (workflow file: release.yml, environment: pypi).
name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Validate distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/interninbox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
