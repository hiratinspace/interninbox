# Publishes to PyPI via Trusted Publishing (OIDC), no tokens stored anywhere.
# Trigger: publishing a GitHub Release (tag vX.Y.Z).
# PyPI side: the project must list this repo + workflow as a trusted publisher for the `interninbox` project
# (workflow file: release.yml, environment: pypi).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure the release tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/interninbox/__init__.py").read_text()).group(1))')"
          if [ "$tag" != "$version" ]; then
            echo "release tag v$tag does not match __version__ $version" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Build sdist and wheel
        run: uv build
      - name: Validate distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/interninbox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
